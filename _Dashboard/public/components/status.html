<!-- The status, priority, tentacle, date and timeframe controls, and the menus they open. -->

<template name="control-data">data-folder="{{folder}}" data-file="{{file}}" data-line="{{{line}}}" data-status="{{status}}"{{#if hasText}} data-text="{{text}}"{{/if}}{{#if cancelled}} data-cancelled="true"{{/if}}{{#if scheduled}} data-scheduled="{{scheduled}}"{{/if}}{{#if deadline}} data-deadline="{{deadline}}"{{/if}}{{#if recur}} data-recur="{{recur}}"{{/if}}{{#if mark}} data-mark="{{mark}}"{{/if}}</template>

<template name="control-checkbox">
  <span class="status-control check-control" {{{attrs}}}>
    <button type="button" class="check-box{{#if icon}} has-icon icon-{{{icon}}}{{/if}}" title="{{title}}" aria-label="{{title}}"{{#if disabled}} disabled{{/if}}></button>
    {{#if caret}}<button type="button" class="status-caret check-caret" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a status"></button>{{/if}}
  </span>
</template>

<template name="control-person">
  <span class="status-control header-control{{#if leader}} leader-control{{/if}}" {{{attrs}}}>
    <button type="button" class="header-button{{#if leader}} leader-button{{/if}}" aria-haspopup="menu" aria-expanded="false" title="{{#if leader}}Change leader{{else}}Change tentacle{{/if}}" aria-label="{{#if leader}}Leader{{else}}Tentacle{{/if}}: {{describe}}">{{label}}</button>
  </span>
</template>

<template name="control-project-status">
  <span class="status-control project-status-control" {{{attrs}}}>
    <button type="button" class="pill pill-{{{status}}} project-status-button" aria-haspopup="menu" aria-expanded="false" title="Change the status" aria-label="Status: {{label}}">{{label}}</button>
  </span>
</template>

<template name="control-project-type">
  <span class="project-type-label">Project type</span>
  <span class="status-control type-control" {{{attrs}}}>
    <button type="button" class="header-button type-button" aria-haspopup="menu" aria-expanded="false" title="Change the project type" aria-label="Project type: {{label}}">{{label}}</button>
  </span>
</template>

<template name="control-timeframe-add">
  <span class="status-control timeframe-control" {{{attrs}}}>
    <button type="button" class="timeframe-add" aria-haspopup="dialog" aria-expanded="false" title="Add a timeframe" aria-label="Add a timeframe"></button>
  </span>
</template>

<template name="control-timeframe-entry">
  <span class="status-control timeframe-control timeframe-entry-control" {{{attrs}}} data-index="{{{index}}}">
    <button type="button" class="timeframe-add timeframe-edit is-set" aria-haspopup="dialog" aria-expanded="false" title="Change this timeframe" aria-label="Change the timeframe {{label}}"></button>
    <button type="button" class="timeframe-remove" title="Delete this timeframe" aria-label="Delete the timeframe {{label}}"></button>
  </span>
</template>

<template name="control-dependency">
  <span class="status-control timeframe-control dependency-control" {{{attrs}}}>
    <button type="button" class="timeframe-add dependency-edit{{#if set}} is-set{{/if}}" aria-haspopup="menu" aria-expanded="false" title="{{action}}" aria-label="{{action}}"></button>
  </span>
</template>

<template name="control-date">
  <span class="status-control timeframe-control date-control" {{{attrs}}} data-field="{{{field}}}" data-label="{{label}}" data-value="{{value}}" data-stored="{{stored}}">
    <button type="button" class="timeframe-add date-edit{{#if set}} is-set{{/if}}" aria-haspopup="dialog" aria-expanded="false" title="{{action}}" aria-label="{{action}}"></button>
  </span>
</template>

<!-- The flag on the Reviewed box: puts the project or tentacle on the Review page until it's
     next reviewed. -->
<template name="control-review-flag">
  <span class="status-control review-flag-control review-flag-{{{kind}}}" {{{attrs}}}>
    <button type="button" class="review-flag-button{{#if on}} is-on{{/if}}" aria-pressed="{{{pressed}}}" title="{{action}}" aria-label="{{action}}"></button>
  </span>
</template>

<template name="review-flagged"><span class="review-flagged review-flag-{{{kind}}}">Flagged for review</span></template>

<template name="control-priority">
  <span class="status-control priority-control" {{{attrs}}} data-priority="{{{value}}}">
    <button type="button" class="priority-button prio {{{className}}}" aria-haspopup="menu" aria-expanded="false" title="{{title}}" aria-label="Priority: {{describe}}">{{{value}}}</button>
  </span>
</template>

<template name="control-status">
  <span class="status-control" {{{attrs}}}>
    <button type="button" class="status-name {{{className}}}" title="{{title}}"{{#if disabled}} disabled{{/if}}>{{name}}</button>
    <button type="button" class="status-caret {{{className}}}" aria-haspopup="menu" aria-expanded="false" aria-label="Choose a status instead of {{name}}"></button>
  </span>
  {{{priority}}}
</template>

<template name="status-menu-panel"><div role="menu" class="{{{className}}}">{{{items}}}</div></template>

<!-- The grey menu at the end of a task row. -->
<template name="control-row-menu">
  <span class="status-control row-menu-control" {{{attrs}}}{{#if inMilestone}} data-in-milestone="true" data-milestone-line="{{{milestoneLine}}}"{{/if}}{{#if blockable}} data-blockable="true"{{/if}}{{#if blockExists}} data-block-exists="true"{{/if}}{{#if childable}} data-childable="true"{{/if}}>
    <button type="button" class="row-menu-button" aria-haspopup="menu" aria-expanded="false" title="More for this task" aria-label="More for this task"></button>
  </span>
</template>

<!-- Add child task (on the task's own page), the dates, then Cancel and Delete. -->
<template name="row-menu-actions">
  {{#if childable}}<button type="button" role="menuitem" data-row="child">Add child task</button>{{/if}}
  <button type="button" role="menuitem" data-plan="SCHEDULED">Schedule</button>
  <button type="button" role="menuitem" data-plan="DEADLINE">Deadline</button>
  <div class="status-menu-sep" role="separator"></div>
  <button type="button" role="menuitem" data-row="cancel"{{#if cancelled}} disabled{{/if}}>Cancel</button>
  <button type="button" role="menuitem" class="is-danger" data-row="delete">Delete</button>
</template>

<!-- The grey menu on a milestone's header. -->
<template name="milestone-menu-actions">
  <button type="button" role="menuitem" data-milestone="promote">Promote to new project</button>
  <button type="button" role="menuitem" data-milestone="done">Mark all as done</button>
  <div class="status-menu-sep is-thin" role="separator"></div>
  <button type="button" role="menuitem" class="is-danger" data-milestone="delete">Delete</button>
</template>

<!-- A status in the status menu, with its type's icon and colour. -->
<template name="status-menu-status"><button type="button" role="menuitem" class="status-menu-status icon-{{{icon}}}" data-to="{{value}}"{{#if current}} disabled aria-current="true"{{/if}}><span class="status-menu-icon" aria-hidden="true"></span>{{label}}</button></template>

<template name="status-menu-divider"><div class="status-menu-sep is-thin" role="separator"></div></template>

<template name="status-menu-type"><div class="status-menu-type">{{type}}</div></template>

<template name="status-menu-item"><button type="button" role="menuitem" data-{{{attr}}}="{{value}}"{{#if current}} disabled aria-current="true"{{/if}}>{{label}}</button></template>

<template name="status-menu-none"><p class="status-menu-type">No other projects to choose.</p></template>

<template name="status-menu-form">
  <form class="status-menu timeframe-form" role="dialog" aria-label="{{heading}}">
    {{{fields}}}
    <p class="timeframe-error" role="alert" hidden></p>
    <button type="submit">{{button}}</button>
  </form>
</template>

<template name="date-input">
  <label>{{label}}
    <span class="date-field">
      <input name="{{{name}}}" placeholder="{{placeholder}}" autocomplete="off"{{#if required}} required{{/if}}{{#if hasValue}} value="{{value}}"{{/if}}>
      <button type="button" class="date-pick" data-date-pick title="Pick a date" aria-label="Pick a date"></button>
      <input type="date" class="date-native" tabindex="-1" aria-hidden="true" value="{{stored}}">
    </span>
  </label>
</template>

<!-- How often a recurring task comes round: 1 to 10 days, weeks, months or years. -->
<template name="recur-fields">
  <label>Every
    <span class="month-field">
      <select name="recurCount" aria-label="How many">{{{counts}}}</select>
      <select name="recurUnit" aria-label="Days, weeks, months or years">{{{units}}}</select>
    </span>
  </label>
</template>

<!-- Which milestones a timeframe covers. Ticking them all, or none, means every milestone. -->
<template name="timeframe-milestones"><fieldset class="timeframe-milestones"><legend>Milestones</legend>{{{boxes}}}</fieldset></template>
<template name="timeframe-milestone"><label><input type="checkbox" name="milestone" value="{{title}}"{{#if checked}} checked{{/if}}> {{title}}</label></template>

<template name="month-input">
  <label>{{label}}
    <span class="month-field">
      <select name="{{{name}}}Month" aria-label="{{label}} month">{{{months}}}</select>
      <select name="{{{name}}}Year" aria-label="{{label}} year">{{{years}}}</select>
    </span>
  </label>
</template>
