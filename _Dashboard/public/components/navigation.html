<!-- The left-hand menu and the Todos sidebar. -->

<template name="nav-count">
  <span class="nav-count {{{className}}}" title="{{label}}: {{{value}}}">
    <span class="visually-hidden">{{label}}: </span>{{{value}}}
  </span>
</template>

<!-- The label stays on one line, cut short with an ellipsis if the menu is too narrow, with the
     whole name in its tooltip. -->
<template name="nav-link"><a class="nav-link{{#if extra}} {{{extra}}}{{/if}}" href="{{href}}"{{#if current}} aria-current="page"{{/if}}><span class="nav-label" title="{{label}}">{{label}}</span>{{{counts}}}{{#if note}}<span class="nav-note">{{note}}</span>{{/if}}</a></template>

<!-- Collapses a sidebar to a thin rail, or opens it again (layout.js). On a wide screen it's a
     round button on the sidebar's edge; on a narrow one, a bar above the sidebar with its name. -->
<template name="sidebar-toggle"><button type="button" class="sidebar-toggle sidebar-toggle-{{{side}}}" data-toggle-sidebar="{{{side}}}" aria-controls="{{{controls}}}" aria-expanded="true"><span class="sidebar-toggle-name">{{name}}</span></button></template>

<!-- The handle on a sidebar's inner edge, dragged to change its width. -->
<template name="sidebar-resizer"><div class="sidebar-resizer sidebar-resizer-{{{side}}}" data-resize="{{{side}}}" role="separator" aria-orientation="vertical" aria-label="{{label}}" tabindex="0" title="Drag to resize, double-click to reset"></div></template>

<!-- Which entity, from _Dashboard/entities.csv, the dashboard is working on. -->
<template name="entity-select">
  <label class="entity-select"><span class="visually-hidden">Entity</span><select data-entity-select>{{{options}}}</select></label>
</template>

<template name="nav-logo"><a class="nav-logo" href="./" title="Dashboard"><img src="{{{src}}}" alt="Logo"><span class="nav-brand">Octapu System</span></a></template>

<template name="nav-group">
  <details class="nav-group" data-group="{{key}}"{{#if open}} open{{/if}}>
    <summary class="nav-link"><span class="nav-label" title="{{label}}">{{label}}</span></summary>
    {{#if links}}<div class="nav-children">{{{links}}}</div>{{else}}<p class="nav-empty">{{empty}}</p>{{/if}}
  </details>
</template>

<!-- A tentacle with others under it. The link opens its page, and the rest of the row shows
     or hides those under it. -->
<template name="nav-branch">
  <details class="nav-branch" data-branch="{{key}}"{{#if open}} open{{/if}}>
    <summary class="nav-branch-head" title="Show or hide the tentacles under {{name}}">{{{link}}}</summary>
    <div class="nav-children">{{{links}}}</div>
  </details>
</template>

<template name="todo-item">
  <li class="todo{{#if ticked}} ticked{{/if}}{{#if tint}} tint tint-{{{tint}}}{{/if}}{{#if recur}} tint recur-{{{recur}}}{{/if}}"{{#if note}} title="{{note}}"{{/if}}>
    <div class="todo-head">
      {{{checkbox}}}
      {{{control}}}
      <a class="todo-project" href="{{{href}}}" title="{{location}}">{{label}}</a>
      {{{menu}}}
    </div>
    {{#if text}}<div class="todo-text">{{{text}}}</div>{{/if}}
    {{#if dates}}<div class="todo-dates">{{{dates}}}</div>{{/if}}
  </li>
</template>

<!-- One of the Todos filter's dropdowns, where any number of choices can be ticked. The
     button shows what's ticked, and the choices open below it. -->
<template name="multi-select">
  <div class="todo-filter">
    <span class="todo-filter-label" id="todo-{{{key}}}-label">{{label}}</span>
    <details class="multi-select" data-filter="{{{key}}}">
      <summary class="multi-select-button" aria-labelledby="todo-{{{key}}}-label todo-{{{key}}}-value"><span class="multi-select-value" id="todo-{{{key}}}-value"></span></summary>
      <div class="multi-select-panel" id="todo-{{{key}}}" role="group" aria-labelledby="todo-{{{key}}}-label"></div>
    </details>
  </div>
</template>

<!-- The choices in one of those dropdowns, after a button that ticks everything (or for
     the filters where nothing ticked means everything, clears them). -->
<template name="multi-options"><button type="button" class="multi-select-all" data-all>{{all}}</button>{{{options}}}</template>

<template name="multi-option"><label class="multi-option"><button type="button" class="check-box{{#if on}} has-icon icon-done{{/if}}" role="checkbox" aria-checked="{{{checked}}}" data-value="{{value}}"></button><span class="multi-option-label">{{label}}</span><span class="multi-option-count">{{{count}}}</span></label></template>

<template name="multi-empty"><p class="multi-select-empty">{{message}}</p></template>

<template name="todo-date"><span><b>{{kind}}</b> {{value}}</span></template>

<template name="todo-divider"><li class="todo-divider" role="separator"></li></template>

<template name="sidebar-shell">
  <div class="sidebar-head">
    <h2>Todos</h2>
    <span class="count" id="todo-count">0</span>
  </div>
  <div class="sidebar-controls">
    {{{filters}}}
    <label class="todo-filter"><span class="todo-filter-label">Sort</span><select id="todo-sort">{{{sort}}}</select></label>
  </div>
  <ul class="todo-list" id="todo-list"></ul>
</template>

<template name="sidebar-message">
  <div class="sidebar-head"><h2>Todos</h2></div>
  <p class="empty">{{text}}</p>
</template>
