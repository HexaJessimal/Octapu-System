<!-- The Incubator page: one card per idea in _Incubator.md. -->
<template name="idea-card">
  <section class="card scratch-block idea-card" data-idea="{{{index}}}">
    <header class="entry-head">
      <h2 class="scratch-title">{{name}}</h2>
      {{#if owner}}<span class="pill">{{owner}}</span>{{/if}}
    </header>
    <dl class="entry-fields">
      <div class="entry-field"><dt>Project Dependency</dt><dd>{{dependency}}</dd></div>
      {{#if notes}}<div class="entry-field"><dt>Notes</dt><dd class="idea-notes">{{{notes}}}</dd></div>{{/if}}
    </dl>
    <div class="idea-actions">
      <button type="button" class="plain-button archive-button" data-archive-idea>Archive Idea</button>
      <button type="button" class="primary-button" data-promote-idea>Promote to Project</button>
    </div>
  </section>
</template>

<template name="notes-field"><label>{{label}}<textarea name="{{{name}}}" rows="6"></textarea></label></template>
