<!-- The parts of a project, tentacle or networking page. -->

<template name="edit-attrs"> data-edit="{{{kind}}}" data-line="{{{line}}}" data-from="{{value}}"</template>

<template name="add-button"><button type="button" class="add-button" data-add="{{{action}}}" title="{{label}}" aria-label="{{label}}"{{#if list}} data-list="{{list}}"{{/if}}{{#if hasLine}} data-line="{{{line}}}" data-title="{{title}}"{{/if}}></button></template>

<!-- A blank milestone, checkbox or task being typed in after pressing a plus button. -->
<template name="quick-add">
  <div class="quick-add {{{className}}}">
    {{#if box}}<span class="check-box" aria-hidden="true"></span>{{/if}}
    <div class="quick-add-body">
      <div class="quick-add-field"></div>
      <p class="quick-add-hint">Press Esc to abort</p>
    </div>
  </div>
</template>

<!-- A titled block has its review date under the title and its flag beside it. -->
<template name="scratch-block">
  <section class="card scratch-block{{#if flagged}} is-flagged{{/if}}">
    {{#if title}}<header class="entry-head"><div class="section-heading-text">{{{title}}}{{{reviewed}}}</div>{{{flag}}}</header>{{/if}}
    <div class="doc scratch-body"{{{attrs}}}>{{{body}}}</div>
  </section>
</template>

<!-- A section's own flag for review, and the date it was last reviewed. -->
<template name="section-flag"><button type="button" class="review-flag-button section-flag{{#if on}} is-on{{/if}}" data-section-flag data-folder="{{folder}}" data-file="{{file}}" data-line="{{{line}}}" data-title="{{title}}" aria-pressed="{{{pressed}}}" title="{{action}}" aria-label="{{action}}"></button></template>
<template name="section-reviewed"><small class="section-reviewed">{{text}}</small></template>

<template name="scratch-title"><h2 class="scratch-title"{{{attrs}}}>{{{title}}}</h2></template>

<template name="labelled-control"><strong>{{label}}</strong>: {{{control}}}</template>

<template name="file-tab"><a class="org-tab" href="?{{query}}"{{#if current}} aria-current="page"{{/if}}>{{file}}</a></template>

<template name="file-tabs"><nav class="org-tabs" aria-label="Files in this folder">{{{tabs}}}{{{add}}}</nav></template>

<template name="raw-document">
  <article class="card doc-card"><div class="doc" title="Double-click to edit"{{{attrs}}}>{{{body}}}</div></article>
</template>

<template name="doc-article"><article class="card doc-card"><div class="doc">{{{body}}}</div></article></template>

<template name="task-list">
  <div class="tasks-section" id="task-list-{{{index}}}">
    <div class="section-row">
      <h2 class="section-title">{{name}}</h2>
      {{{add}}}
    </div>
    {{{body}}}
  </div>
</template>

<template name="progress-meter">
  <div class="overall">
    <span>{{{percent}}}% of tasks done</span>
    <progress class="meter" value="{{{percent}}}" max="100"></progress>
    <span>{{{done}}} / {{{total}}}</span>
  </div>
</template>

<template name="doc-title"><span{{{attrs}}}>{{{text}}}</span></template>

<!-- The summary at the top of a project or tentacle Overview. `corner` goes at its top right. -->
<template name="summary-card">
  <section class="card summary">
    {{{corner}}}
    <h2>{{{title}}}</h2>
    <dl class="facts{{#if grid}} facts-grid{{/if}}{{#if quarters}} facts-quarters{{/if}}">{{{facts}}}</dl>
    {{{footer}}}
  </section>
</template>

<!-- Where a tentacle's Overview puts its Timeline, below the summary. -->
<template name="tentacle-timeline">
  <section class="tentacle-timeline">
    <h2 class="section-title">Timeline</h2>
    <div data-timeline-slot></div>
  </section>
</template>

<!-- Opens the project's or tentacle's folder in the computer's file browser. -->
<template name="folder-button"><button type="button" class="folder-button" data-open-folder="{{folder}}" title="Open this folder" aria-label="Open this folder in your file browser"></button></template>

<template name="fact"><div{{#if className}} class="{{{className}}}"{{/if}}><dt>{{label}}</dt><dd>{{{value}}}</dd></div></template>

<template name="fact-timeframe">
  <div class="fact-wide fact-timeframe">
    <dt class="fact-heading">Active Timeframe{{{control}}}</dt>
    <dd>{{{body}}}</dd>
  </div>
</template>

<template name="timeframe-list"><ul class="timeframe-list">{{{rows}}}</ul></template>

<!-- A timeframe, with the milestones it's limited to, if any, in small text below. -->
<template name="timeframe-row"><li><span>{{dates}}{{#if milestones}}<small class="timeframe-names">{{milestones}}</small>{{/if}}</span>{{{control}}}</li></template>

<template name="progress-nav"><nav class="card progress" aria-label="Milestone progress">{{{segments}}}</nav></template>

<template name="progress-nav-segment">
  <a class="segment state-{{{state}}}" href="#ms-{{{index}}}" title="{{title}}">
    <span class="seg-title">{{name}}</span>
    <span class="seg-count">{{{count}}}</span>
  </a>
</template>

<template name="milestone-stack"><div class="milestones milestones-spaced">{{{cards}}}</div></template>

<template name="milestone-card">
  <section class="card milestone state-{{{state}}}{{#if collapsed}} is-collapsed{{/if}}{{#if flagged}} is-flagged{{/if}}" id="ms-{{{index}}}" data-index="{{{index}}}" data-title="{{title}}">
    <header>
      <span class="milestone-handle" data-drag draggable="true" tabindex="0" role="button" title="Drag to reorder" aria-label="Reorder this milestone with the up and down arrow keys"></span>
      <button type="button" class="collapse-button" data-collapse aria-expanded="{{{expanded}}}" aria-label="Show or hide this milestone"></button>
      <div class="section-heading-text"><h3{{{attrs}}}>{{{heading}}}</h3>{{{reviewed}}}</div>
      <div class="ms-actions">
        {{{flag}}}
        <span class="ms-count">{{counts}}</span>
        {{{add}}}
        <span class="status-control milestone-menu-control" data-line="{{{line}}}" data-title="{{title}}">
          <button type="button" class="row-menu-button milestone-menu-button" aria-haspopup="menu" aria-expanded="false" title="More for this milestone" aria-label="More for the milestone {{title}}"></button>
        </span>
      </div>
    </header>
    <div class="ms-body">{{{body}}}</div>
  </section>
</template>

<template name="doc-body"><div class="doc">{{{body}}}</div></template>

<template name="back-link"><span aria-hidden="true">‹</span> {{label}}</template>

<!-- A tentacle tab, coloured by how deep it is: level-0 for the top-level tentacle, then 1, 2,
     and level-deep for anything below that. On the path means it's above the open tab. -->
<template name="org-tab"><a class="org-tab org-level-{{{level}}}{{#if onPath}} is-on-path{{/if}}" href="{{href}}"{{#if current}} aria-current="page"{{/if}}>{{name}}</a></template>

<!-- One row of tentacle tabs: a tentacle's, below the row with its parent's. -->
<template name="org-tab-row"><div class="org-tabs org-tab-row">{{{tabs}}}{{{add}}}</div></template>

<template name="org-tab-add"><button type="button" class="add-button org-tab-add" data-new-tentacle title="New tentacle" aria-label="New tentacle"></button></template>

<template name="entry-field">
  <div class="entry-field{{#if intro}} entry-intro{{/if}}">
    {{#if intro}}{{else}}<dt>{{label}}</dt>{{/if}}
    <dd class="doc"{{{attrs}}}{{#if missing}} data-label="{{label}}"{{/if}}>{{{body}}}</dd>
  </div>
</template>

<!-- An event's date or Yes/No field, which has its own control rather than a text box. -->
<template name="entry-value">
  <div class="entry-field">
    <dt>{{label}}</dt>
    <dd class="entry-value{{#if invalid}} is-invalid{{/if}}"{{#if invalid}} title="Not a date the dashboard can read. Change it, or use Fix issues on Compatibility &gt; Events."{{/if}}>{{{body}}}</dd>
  </div>
</template>

<template name="entry-date-edit"><button type="button" class="entry-date-button{{#if set}} is-set{{/if}}" data-event-date="{{label}}" title="{{action}}" aria-label="{{action}}"></button></template>

<template name="entry-check"><button type="button" class="check-box{{#if on}} has-icon icon-done{{/if}}" role="checkbox" aria-checked="{{{checked}}}" data-event-check="{{label}}" aria-label="{{label}}"></button></template>

<!-- Filters above the Events list, by how far each event has got. -->
<template name="event-filters"><div class="chips event-filters" role="group" aria-label="Filter events">{{{chips}}}</div></template>

<template name="event-filter"><button type="button" class="chip" data-event-filter="{{{key}}}" aria-pressed="{{{pressed}}}">{{label}} <span class="count">{{{count}}}</span></button></template>

<template name="entry-card">
  <section class="card scratch-block{{#if target}} is-target{{/if}}{{#if progress}} is-{{{progress}}}{{/if}}{{#if flagged}} is-flagged{{/if}}" data-entry="{{{index}}}">
    <header class="entry-head">
      <div class="section-heading-text"><h2 class="scratch-title"{{{attrs}}}>{{{title}}}</h2>{{{reviewed}}}</div>
      {{{flag}}}
      <button type="button" class="row-remove" data-remove-entry title="Delete this {{noun}}" aria-label="Delete {{name}}"></button>
    </header>
    <dl class="entry-fields">{{{fields}}}</dl>
  </section>
</template>

<template name="entry-new">
  <div class="section-row">
    <button type="button" class="add-button" data-add-entry title="New {{noun}}" aria-label="New {{noun}}"></button>
    <span class="section-title">New {{noun}}</span>
  </div>
</template>
