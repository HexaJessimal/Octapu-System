<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tentacle · Octapu System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="api/colours.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="nav-sidebar" id="main-nav" aria-label="Main menu"></nav>
      <main class="wrap">
        <div class="view-bar">
          <div class="toggle" role="group" aria-label="View mode">
            <button type="button" data-view="overview" aria-pressed="true">Overview</button>
            <button type="button" data-view="scratchpad" aria-pressed="false">Scratchpad</button>
            <button type="button" data-view="raw" aria-pressed="false">Raw</button>
            <button type="button" data-view="changelog" aria-pressed="false" hidden>Changelog</button>
          </div>
        </div>
        <header class="topbar">
          <h1 id="page-title">Loading…</h1>
        </header>
        <nav class="org-tab-rows" id="org-tabs" aria-label="This tentacle and those under it"></nav>
        <div id="conflicts"></div>
        <div id="content"></div>
        <!-- The Timeline, moved into the Overview below the summary on each redraw, so it keeps
             its scroll position and listeners (tentacle.js). -->
        <div id="timeline-holder" hidden><div id="timeline"></div></div>
      </main>
      <aside class="sidebar" id="todo-sidebar" aria-label="Todos"></aside>
    </div>

    <script src="api/components.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/layout.js"></script>
    <script src="api/tags.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/status.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/edit.js"></script>
    <script src="js/document-view.js"></script>
    <script src="js/changes.js"></script>
    <script src="js/tentacle.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/sidebar.js"></script>
  </body>
</html>
