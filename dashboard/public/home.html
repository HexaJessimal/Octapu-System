<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Overview · Octapu System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="api/colours.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="nav-sidebar" id="main-nav" aria-label="Main menu"></nav>
      <main class="wrap">
        <header class="topbar">
          <h1>Dashboard</h1>
          <div class="toggle" role="group" aria-label="Dashboard section">
            <button type="button" data-tab="overview" aria-pressed="true">Overview</button>
            <button type="button" data-tab="report" aria-pressed="false">Report</button>
          </div>
        </header>
        <div id="overview-panel">
          <div class="home-stats" id="home-stats"></div>
          <div class="section-row"><h2 class="section-title">Timeline</h2></div>
          <div id="timeline"></div>
          <div id="content"></div>
        </div>
        <div id="report-panel" hidden></div>
      </main>
      <aside class="sidebar" id="todo-sidebar" aria-label="Todos"></aside>
    </div>

    <script src="api/components.js"></script>
    <script src="js/projects.js"></script>
    <script src="api/owner-tags.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/status.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/home.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/sidebar.js"></script>
  </body>
</html>
