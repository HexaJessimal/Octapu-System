<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up · Octapu System</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="api/colours.css" />
  </head>
  <body>
    <main class="setup-wrap">
      <div class="modal">
        <form id="setup-form">
          <h2>Set up Octapu System</h2>
          <p class="setup-note">Just a few details to get started. You can change any of this later in Options.</p>
          <div id="setup-fields" hidden></div>
          <p class="setup-note" id="setup-files" hidden></p>
          <p class="form-error" role="alert" hidden></p>
          <div class="modal-actions"><button type="submit" class="primary-button">Get started</button></div>
        </form>
      </div>
    </main>

    <script src="api/components.js"></script>
    <script src="js/projects.js"></script>
    <script src="js/setup.js"></script>
  </body>
</html>
